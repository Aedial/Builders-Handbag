apply from: 'gradle/scripts/helpers.gradle'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    mavenLocal() // Must be last for caching to work
}

/**
 * NOT DEPENDENCIES:
 *  - runtimeOnly: not required at all for the mod, added for developer convenience to run targets
 * OPTIONAL DEPENDENCIES:
 *  - compileOnly: will not be included in developer run targets
 *  - devOnlyNonPublishable: will be included in developer run targets
 * REQUIRED DEPENDENCIES:
 *  - implementation: mods or other jars that are required to be installed alongside this mod
 */
dependencies {
    // Include StripLatestForgeRequirements by default for the dev env
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // ---- Required dependencies ----

    // ---- Optional: Chisel ----
    devOnlyNonPublishable rfg.deobf("curse.maven:chisel-235279:2915375")

    // ---- Optional: ArchitectureCraft ----
    devOnlyNonPublishable rfg.deobf("curse.maven:architecturecraft-tridev-277631:4344128")

    // ---- Optional: BlockCraftery ----
    devOnlyNonPublishable rfg.deobf("curse.maven:blockcraftery-278882:2716712")
    // BlockCraftery declares this as a required runtime dependency.
    devOnlyNonPublishable rfg.deobf("curse.maven:mysticallib-277064:2716268")

    // ---- Optional: AE2-UEL ----
    devOnlyNonPublishable rfg.deobf("curse.maven:ae2-extended-life-570458:5378163")
}
